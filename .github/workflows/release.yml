name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release create "$TAG" app/build/outputs/vixlauncher/VixLauncher.apk \
            --title "VixLauncher $TAG" \
            --notes "Automatic APK build from commit $GITHUB_SHA."
